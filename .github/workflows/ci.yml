name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: 后端与 Python 质量检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: delivery_note_test
          POSTGRES_USER: delivery_note
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delivery_note -d delivery_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://delivery_note:ci-postgres-password@127.0.0.1:5432/delivery_note_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff 检查
        run: python -m ruff check delivery_note tests scripts
      - name: 增量规模与 Python 导入检查
        env:
          QUALITY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.check_code_health --base "$QUALITY_BASE"
      - name: 检查工具类型与格式
        run: |
          python -m mypy --strict scripts/check_code_health.py scripts/python_imports.py tests/test_code_health.py
          python -m ruff format --check scripts/check_code_health.py scripts/python_imports.py tests/test_code_health.py
      - name: Worker 与全量 Web 模块类型检查
        run: python -m mypy
      - name: 模型与契约测试格式检查
        run: python -m ruff format --check delivery_note/web/models tests/test_model_contracts.py
      - name: 异常读写模块格式检查
        run: python -m ruff format --check delivery_note/web/exception_read_routes.py delivery_note/web/exception_write_routes.py delivery_note/web/exception_views.py
      - name: 批次查询与导出模块格式检查
        run: python -m ruff format --check delivery_note/web/batch_read_routes.py delivery_note/web/batch_export_routes.py delivery_note/web/batch_views.py tests/web/test_batch_exports.py
      - name: 任务入口与契约测试格式检查
        run: python -m ruff format --check delivery_note/web/job_routes.py delivery_note/web/api.py tests/web/test_jobs.py tests/web/test_exception_queries.py
      - name: 认证与用户管理模块格式检查
        run: python -m ruff format --check delivery_note/web/auth_routes.py delivery_note/web/user_accounts.py tests/web/test_auth_cookies.py tests/web/test_auth_users.py
      - name: 基础资料查询与下载模块格式检查
        run: python -m ruff format --check delivery_note/web/input_version_read_routes.py delivery_note/web/caches.py tests/web/test_input_versions.py tests/web/test_input_inspection_cache.py
      - name: 基础资料上传与激活模块格式检查
        run: python -m ruff format --check delivery_note/web/input_version_routes.py delivery_note/web/input_versions.py tests/web/test_input_version_commands.py
      - name: 共享上传与健康模块格式检查
        run: python -m ruff format --check delivery_note/web/uploads.py delivery_note/web/health_routes.py tests/web/test_upload_concurrency.py
      - name: 批次写入与维护模块格式检查
        run: python -m ruff format --check delivery_note/web/batch_creation.py delivery_note/web/batch_creation_routes.py delivery_note/web/batch_file_edits.py delivery_note/web/batch_file_routes.py delivery_note/web/batch_file_uploads.py delivery_note/web/batch_maintenance.py delivery_note/web/batch_maintenance_routes.py delivery_note/web/batch_preflight.py delivery_note/web/self_operated_creation.py delivery_note/web/self_operated_creation_routes.py delivery_note/web/dependencies.py tests/web/test_inbound_files.py
      - name: 库位草稿与分析模块格式检查
        run: python -m ruff format --check delivery_note/web/position_draft_state.py delivery_note/web/position_draft_files.py delivery_note/web/position_draft_read.py delivery_note/web/position_draft_lifecycle.py delivery_note/web/position_draft_import.py delivery_note/web/position_draft_read_routes.py delivery_note/web/position_draft_row_routes.py delivery_note/web/position_draft_lifecycle_routes.py delivery_note/web/position_draft_import_routes.py delivery_note/web/caches.py delivery_note/web/app_setup.py delivery_note/inspection/positions.py
      - name: 规则与同步模块格式检查
        run: python -m ruff format --check delivery_note/web/gerpgo_routes.py delivery_note/web/overreceipt_routes.py delivery_note/web/self_operated_rule_routes.py delivery_note/web/sync/inbound_routes.py delivery_note/web/sync/purchase_routes.py delivery_note/web/sync/views.py delivery_note/web/sync/queries.py delivery_note/web/sync/issues.py delivery_note/web/sync/commands.py
      - name: Python 死代码检查
        run: python -m vulture delivery_note scripts --min-confidence 100
      - name: 后端测试
        run: python -m unittest discover -s tests -v
      - name: Python 依赖检查
        run: python -m pip check

  frontend:
    name: 前端增量格式、类型检查与测试构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 前端依赖安全审计
        run: npm audit --registry=https://registry.npmjs.org
      - name: 增量格式检查
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check -- --base "$FORMAT_BASE"
      - name: 独立类型检查
        run: npm run typecheck
      - name: 质量门禁测试
        run: npm run test:quality
      - name: 工程脚本 ESLint
        run: npm run lint:tools
      - name: 增量 React 与 TypeScript ESLint
        env:
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint -- --base "$LINT_BASE"
      - name: 全量 React 与 TypeScript ESLint
        run: npm run lint:all
      - name: 重复代码扫描
        run: npm run check:duplicates
      - name: 前端死代码检查
        run: npm run check:unused
      - name: 前端导入循环检查
        run: npm run check:imports
      - name: 前端测试
        run: npm run test
      - name: 生产构建
        run: npm run build

  configuration:
    name: 提交与 Compose 配置检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 检查 PR 差异
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
      - name: 检查 master 推送差异
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}" "${{ github.sha }}"
      - name: 校验 Compose 配置
        env:
          ADMIN_PASSWORD: ci-admin-password
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config --quiet

name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: 后端与 Python 质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff 检查
        run: python -m ruff check delivery_note tests scripts
      - name: 后端测试
        run: python -m unittest discover -s tests -v
      - name: Python 依赖检查
        run: python -m pip check

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 前端测试
        run: npm run test
      - name: 生产构建
        run: npm run build

  configuration:
    name: 提交与 Compose 配置检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 检查 PR 差异
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
      - name: 检查 master 推送差异
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}" "${{ github.sha }}"
      - name: 校验 Compose 配置
        env:
          ADMIN_PASSWORD: ci-admin-password
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config --quiet

name: 前端检查

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: 前端增量格式、类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 前端依赖安全审计
        run: npm audit --registry=https://registry.npmjs.org
      - name: 增量格式检查
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check -- --base "$FORMAT_BASE"
      - name: 独立类型检查
        run: npm run typecheck
      - name: 质量门禁测试
        run: npm run test:quality
      - name: 工程脚本 ESLint
        run: npm run lint:tools
      - name: 增量 React 与 TypeScript ESLint
        env:
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint -- --base "$LINT_BASE"
      - name: 全量 React 与 TypeScript ESLint
        run: npm run lint:all
      - name: 重复代码扫描
        run: npm run check:duplicates
      - name: 前端死代码检查
        run: npm run check:unused
      - name: 前端导入循环检查
        run: npm run check:imports
      - name: 生产构建
        run: npm run build

  frontend-tests:
    name: 前端测试 ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 前端测试
        run: npm run test -- --shard=${{ matrix.shard }}/3

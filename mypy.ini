[mypy]
python_version = 3.11
platform = linux
follow_imports = silent
files =
    delivery_note/web,
    tests/test_model_contracts.py,
    scripts/backup,
    scripts/backup_deliverynote.py,
    tests/backup,
    delivery_note/workers,
    delivery_note/processing,
    delivery_note/inbound,
    delivery_note/excel,
    delivery_note/excel_io.py,
    delivery_note/inspection,
    delivery_note/input_inspection.py,
    delivery_note/self_operated_inbound.py,
    delivery_note/pipeline.py,
    tests/support,
    tests/inbound,
    tests/excel,
    tests/inspection,
    tests/processing,
    tests/positions,
    tests/web,
    tests/workers,
    delivery_note/worker.py,

[mypy-delivery_note.web.*]
check_untyped_defs = True
disallow_untyped_defs = True
disallow_any_generics = True
